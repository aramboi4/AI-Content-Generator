# Makes and uploads two Shorts a day, plus a LogExpense ad every Saturday.
# Main runs are started on time by cron-job.org (06:20 and 18:20 Manila, Saturday ad 09:30; see README
# "On-time runs") and scheduled on YouTube for 08:00 / 20:00 (ad 12:00); a run that finishes too late posts
# right away. GitHub's own schedules below start 2-7 hours late, so they are only backups: every automatic
# run does nothing if that video was already uploaded.
name: Daily videos

on:
  schedule:
    # Backups for the 06:20 / 18:20 on-time runs (they only act if the video is still missing).
    - cron: "13 1 * * *"   # 09:13 Manila -> fun facts backup
    - cron: "13 4 * * *"   # 12:13 Manila -> fun facts second backup
    - cron: "13 13 * * *"  # 21:13 Manila -> story backup
    - cron: "13 15 * * *"  # 23:13 Manila -> story second backup
    # Saturday ad: GitHub run 05:13 (retry 08:13) plus the 09:30 on-time run; goes public at 12:00.
    - cron: "13 21 * * 5"
    - cron: "13 0 * * 6"
    # Extra one-off ads: Sunday 05:13 Manila (+ retry 08:13), only on the dates in EXTRA_AD_DATES.
    - cron: "13 21 * * 6"
    - cron: "13 0 * * 0"
  # On-time runs: an outside cron service (cron-job.org) calls GitHub's API with run=facts/story/ad at the
  # exact time (see README "On-time runs"). The schedules above stay as backups; every automatic run skips
  # itself if that video was already uploaded in the last 9 hours, so nothing is made twice.
  workflow_dispatch:
    inputs:
      run:
        description: "Leave on manual. (facts/story/ad = an automatic run, used by the outside cron service)"
        type: choice
        options: [manual, facts, story, ad]
        default: manual
      style:
        description: "facts, story, or ad (LogExpense)"
        type: choice
        options: [facts, story, ad]
        default: facts
      upload:
        description: "Upload to YouTube (scheduled for today's slot, or posted now if it has passed)"
        type: boolean
        default: false

permissions:
  contents: write   # commit history.json so topics don't repeat
  models: read      # GitHub Models: last-resort backup script writer

concurrency:
  group: daily-videos
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moves to Ubuntu 26 from Oct 19, 2026
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # for GitHub Models
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      YT_API_KEY: ${{ secrets.YT_API_KEY }}
      YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      INWORLD_API_KEY: ${{ secrets.INWORLD_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      ACG_TZ: Asia/Manila
      ACG_ART_STYLE: realistic   # AI image style: 3d or realistic
      # Scheduled LogExpense ads: set ADS_PAUSED to "false" to run them every Saturday from ADS_START_DATE.
      ADS_PAUSED: "false"
      ADS_START_DATE: "2026-10-17"
      # One-off extra ads on a Sunday (Manila dates, space-separated), on top of the Saturday ads.
      EXTRA_AD_DATES: "2026-11-22"
      IMAGEIO_FFMPEG_EXE: /usr/bin/ffmpeg
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7

      - name: Pick video type
        id: plan
        run: |
          retry=false; retry_at=""; extra=false; auto=false
          run_input="${{ inputs.run }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$run_input" ] && [ "$run_input" != manual ]; then
            # Started on time by the outside cron service: behaves like a scheduled run.
            style="$run_input"; upload=true; auto=true
            echo "ACG_RETRY_NOTE=GitHub's backup runs will try again within a few hours." >> "$GITHUB_ENV"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            style="${{ inputs.style }}"; upload="${{ inputs.upload }}"
          else
            upload=true; auto=true
            case "${{ github.event.schedule }}" in
              "13 1 * * *")  style=facts; retry_at="12:13 PM" ;;
              "13 4 * * *")  style=facts; retry=true ;;
              "13 13 * * *") style=story; retry_at="11:13 PM" ;;
              "13 15 * * *") style=story; retry=true ;;
              "13 21 * * 5") style=ad; retry_at="8:13 AM" ;;
              "13 0 * * 6")  style=ad; retry=true ;;
              "13 21 * * 6") style=ad; extra=true; retry_at="8:13 AM" ;;
              "13 0 * * 0")  style=ad; extra=true; retry=true ;;
            esac
          fi
          if [ "$extra" = true ] && [[ " $EXTRA_AD_DATES " != *" $(TZ=Asia/Manila date +%F) "* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No extra ad scheduled for today (EXTRA_AD_DATES: ${EXTRA_AD_DATES:-none}) - skipping." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "retry=$retry" >> "$GITHUB_OUTPUT"
          if [ -n "$retry_at" ]; then
            echo "ACG_RETRY_NOTE=A retry will run automatically at $retry_at (Manila)." >> "$GITHUB_ENV"
          fi
          if [ "$auto" = true ]; then
            # Automatic runs (on-time trigger, GitHub schedule or retry) only make a video if no other run has
            # uploaded this one in the last 9 hours.
            if python3 - "$style" <<'PY'
          import json, sys
          from datetime import datetime, timedelta, timezone
          cutoff = datetime.now(timezone.utc) - timedelta(hours=9)
          done = [e for e in json.load(open("history.json", encoding="utf-8"))
                  if e.get("style") == sys.argv[1] and e.get("youtube") and e.get("date_utc")
                  and datetime.fromisoformat(e["date_utc"]) >= cutoff]
          sys.exit(0 if done else 1)
          PY
            then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "Today's $style video was already uploaded by another run - nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            else
              echo "No $style video uploaded yet - making it now." | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ "$style" = ad ]; then
            echo "niche=budgeting tips" >> "$GITHUB_OUTPUT"   # used for trend hashtags only
            echo "publish=12:00" >> "$GITHUB_OUTPUT"
          elif [ "$style" = story ]; then
            # auto = random: inspiring stories, kind animals, or kindness traditions around the world
            echo "niche=auto" >> "$GITHUB_OUTPUT"
            echo "publish=20:00" >> "$GITHUB_OUTPUT"
          else
            # auto = random: fun facts or feel-good science
            echo "niche=auto" >> "$GITHUB_OUTPUT"
            echo "publish=08:00" >> "$GITHUB_OUTPUT"
          fi
          echo "upload=$upload" >> "$GITHUB_OUTPUT"
          echo "style=$style" >> "$GITHUB_OUTPUT"
          today=$(TZ=Asia/Manila date +%F)
          if [ "$style" = ad ] && [ "$auto" = true ] && { [ "$ADS_PAUSED" = "true" ] || [[ "$today" < "$ADS_START_DATE" ]]; }; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "LogExpense ads are paused (ADS_PAUSED=$ADS_PAUSED, start date $ADS_START_DATE) - skipping this run." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install FFmpeg
        if: steps.plan.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fontconfig

      - uses: actions/setup-python@v7
        if: steps.plan.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.plan.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Install a browser for the ad's website screenshots
        if: steps.plan.outputs.skip != 'true' && steps.plan.outputs.style == 'ad'
        run: |
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium

      - name: Cache voice and speech models (Kokoro, Piper, Whisper)
        if: steps.plan.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: |
            assets/kokoro
            assets/piper
            assets/whisper
          key: voices-kokoro-v1.0-piper-ryan-whisper-base-en-base   # base = multilingual, for Filipino ads

      - name: Make video
        if: steps.plan.outputs.skip != 'true'
        env:
          NICHE: ${{ steps.plan.outputs.niche }}
          STYLE: ${{ steps.plan.outputs.style }}
          PUBLISH: ${{ steps.plan.outputs.publish }}
          UPLOAD: ${{ steps.plan.outputs.upload }}
        run: |
          # Scheduled for today's slot if it's still ahead; posted publicly right away if the run is late.
          args=(--niche "$NICHE" --style "$STYLE" --publish-slot "$PUBLISH")
          if [ "$STYLE" = "ad" ]; then
            export ACG_TREND_REGION=PH   # ads target the Philippines first, in natural Filipino (Taglish)
            args+=(--brief ads/logexpense.md --website logexpense.site --seconds 30 --language tl
                   --cta-text "subukan nang libre sa logexpense.site"
                   --cta-voice "Subukan nang libre sa log expense dot site.")
          fi
          if [ "$UPLOAD" = "true" ]; then args+=(--upload); fi
          python -m acg make "${args[@]}"

      - name: Save history
        if: success() && steps.plan.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history.json
          git commit -m "Add ${{ steps.plan.outputs.style }} video to history [skip ci]" || exit 0
          git pull --rebase -q && git push -q

      - name: Keep video + posting guide for TikTok/Instagram
        id: artifact
        if: always() && steps.plan.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.plan.outputs.style }}-${{ github.run_number }}
          path: |
            output/*/video.mp4
            output/*/POSTING_GUIDE.md
          retention-days: 3   # runs (and their videos) are deleted after 2 days by cleanup.yml
          if-no-files-found: ignore

      - name: Add download link to the run page
        if: always() && steps.artifact.outputs.artifact-url != ''
        env:
          URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo "## ⬇️ [Download video.mp4 + posting guide (zip)]($URL)"
            echo "Available for 2 days. Unzip it, then post video.mp4 to TikTok and Instagram with the captions above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send the full-quality download link if the video was too big for Telegram
        if: always() && steps.artifact.outputs.artifact-url != '' && hashFiles('output/.telegram_oversize') != ''
        env:
          URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          mb=$(cat output/.telegram_oversize)
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"             --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}"             --data-urlencode "text=⬇️ Full-quality video (${mb} MB, too big for Telegram): ${URL}
          Sign in to GitHub, download the zip, and unzip it to get video.mp4. Available for 2 days."

      - name: Alert on Telegram if the run failed outside the video code
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STYLE: ${{ steps.plan.outputs.style }}
        run: |
          if [ -f output/.failure_reported ] || [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          curl -s -o /dev/null "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Daily ${STYLE:-video} run failed during setup (before the video was made). Log: ${RUN_URL} ${ACG_RETRY_NOTE:+🔁 $ACG_RETRY_NOTE}"
