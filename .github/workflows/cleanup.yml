# Deletes finished workflow runs older than keep_days (default 2), with their logs and saved videos.
# Started daily by cron-job.org (no GitHub schedule).
# The voice-model cache and history.json are not affected.
name: Clean up old runs

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Keep runs from the last how many days? (whole number, 1 or more)"
        type: string
        default: "2"

permissions:
  actions: write   # needed to delete runs

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete old runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          KEEP_DAYS: ${{ inputs.keep_days || '2' }}
        run: |
          if ! [[ "$KEEP_DAYS" =~ ^[1-9][0-9]{0,2}$ ]]; then
            echo "keep_days must be a whole number from 1 to 999, got '$KEEP_DAYS'. Nothing was deleted." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          cutoff=$(date -u -d "-${KEEP_DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting finished runs created before $cutoff"
          # Collect the IDs first, then delete, so deleting doesn't shift the pages being read.
          ids=$(gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
                --jq ".workflow_runs[] | select(.status == \"completed\" and .created_at < \"$cutoff\") | .id")
          deleted=0; failed=0
          for id in $ids; do
            if gh api -X DELETE "repos/$REPO/actions/runs/$id" --silent; then
              deleted=$((deleted + 1))
            else
              failed=$((failed + 1))
            fi
          done
          echo "Kept the last $KEEP_DAYS day(s). Deleted $deleted run(s), $failed failed." | tee -a "$GITHUB_STEP_SUMMARY"
